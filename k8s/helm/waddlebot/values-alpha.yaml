## Waddlebot - Alpha Environment Overrides
webui:
  publicUrl: "http://192.168.10.75:30879"  # node LAN IP + hub-webui NodePort — `!sq` links must open off-laptop

global:
  imageRegistry: ""
  imageTag: "alpha"
  imagePullPolicy: IfNotPresent  # Never makes containerd skip localhost:32000 (ErrImageNeverPull) -- images are pushed, not side-loaded
  deploymentTier: "alpha"
  # gRPC transport TLS (PR #264) -- alpha is single-node local dev with no cert material
  # provisioned, so it uses flask_core's own documented dev-only escape hatch instead of
  # real certs (refused outright under production posture, so this can never leak into
  # beta/gamma/production even if this file were merged upward by mistake).
  grpcTls:
    insecureDev: true
  # First-run super-admin bootstrap (PR #256) -- documented non-default so alpha's
  # Playwright e2e suite (tests/k8s/alpha/) has a known login; NEVER reused in
  # beta/gamma/production (see values.yaml global.initialAdmin).
  initialAdmin:
    email: "admin@waddlebot.localhost.local"
    password: "WaddleAlpha-Local-Only-2026!"
infrastructure:
  postgresql:
    enabled: true
    replicas: 1
    persistence: {size: 1Gi}
    resources:
      requests: { cpu: "250m", memory: "256Mi" }
      limits: { cpu: "1000m", memory: "1Gi" }
  redis:
    enabled: true
    replicas: 1
    persistence: {size: 512Mi}
    resources:
      requests: { cpu: "50m", memory: "64Mi" }
      limits: { cpu: "250m", memory: "256Mi" }
  # Issue #287 -- svc-streaming (Rust) recordings target. Min-spec'd for a single-node
  # laptop; service.name overridden to "waddlebot-minio" so the literal S3_ENDPOINT wired
  # into svc-streaming's env (templates/svc-streaming.yaml) resolves correctly.
  minio:
    enabled: true
    service:
      name: "waddlebot-minio"
      type: ClusterIP
    persistence:
      size: 2Gi
    resources:
      requests: { cpu: "50m", memory: "128Mi" }
      limits: { cpu: "300m", memory: "512Mi" }
  ollama:
    enabled: false
  qdrant:
    enabled: false

# WADDLES_AI_ENABLED=false -- no Ollama deployed above (infrastructure.
# ollama.enabled: false), so hub-api's AI-routing subsystem stays off too
# rather than crash-looping/degrading against an unreachable backend.
#
# Resources/replicas min-spec'd for a single-node laptop (see
# docs/plans -- alpha min-spec pass). Pipeline app services share one
# generic tier; hubApi/hubWebui are sized individually to match their
# lighter footprint.
pipeline:
  svcIngest:
    replicas: 1
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "512Mi" }
  svcProcess:
    replicas: 1
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "512Mi" }
  svcAction:
    replicas: 1
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "512Mi" }
  svcCore:
    replicas: 1
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "512Mi" }
  hubApi:
    aiEnabled: false
    replicas: 1
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "400m", memory: "384Mi" }
  hubWebui:
    replicas: 1
    resources:
      requests: { cpu: "50m", memory: "64Mi" }
      limits: { cpu: "200m", memory: "256Mi" }
  svcRtc:
    replicas: 1
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "512Mi" }
  svcPresentation:
    replicas: 1
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "512Mi" }
  # Issue #287 -- transcode-capable min-spec (higher than the generic pipeline tier above)
  # plus fixed alpha NodePorts for direct RTMP/SRT/HTTP media ingest (OBS/ffmpeg target
  # localhost:31935 for RTMP push). PUBLIC_BASE_URL uses the node LAN IP + the http
  # NodePort below so playback URLs resolve off-laptop, matching webui.publicUrl's pattern.
  svcStreaming:
    replicas: 1
    publicBaseUrl: "http://192.168.10.75:31208"
    nodePort:
      enabled: true
      rtmpPort: 31935
      srtPort: 30900
      httpPort: 31208
    resources:
      requests: { cpu: "200m", memory: "256Mi" }
      limits: { cpu: "2000m", memory: "1Gi" }

presentation:
  image:
    repository: "localhost:32000/waddlebot/svc-presentation"
    tag: "alpha"
  service:
    type: NodePort
    nodePort: 31032

# Issue #287 -- svc-streaming (Rust) image, built locally + pushed to the local registry
# (no CI image for it yet), same as every other alpha module.
streaming:
  image:
    repository: "localhost:32000/waddlebot/svc-streaming"
    tag: "alpha"

# Reputation service (Issue #310) -- built locally, pushed to the local
# registry (no CI image for it yet), same as every other alpha module.
reputation:
  replicas: 1
  image:
    repository: "localhost:32000/waddlebot/reputation-module"
    tag: "alpha"
  env:
    deploymentTier: "alpha"
    workers: 1
  resources:
    requests: { cpu: "50m", memory: "96Mi" }
    limits: { cpu: "300m", memory: "256Mi" }

ingress:
  enabled: false
spire:
  enabled: true
  environment: "alpha"
  server:
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "250m", memory: "256Mi" }
  agent:
    resources:
      requests: { cpu: "50m", memory: "64Mi" }
      limits: { cpu: "150m", memory: "128Mi" }

# Alpha is where the local e2e Playwright suite runs (tests/k8s/alpha/07-page-load.sh).
# Unlike beta (which already raises this 3x for the same reason), alpha inherited no
# override at all and ran on the hardcoded 100 req/min production default -- too strict
# for rapid SERIAL Playwright runs against a cold, cache-less cluster. Alpha-only,
# env-var driven (admin/hub_module/backend/src/config/index.js); production/default
# stays untouched at 100.
#
# Legacy modules.* (31->7 collapse in progress -- see PIPELINE_MAPPING.md).
# KEEP all enabled; resources/replicas min-spec'd only. hub/hubWebui match
# their pipeline.hubApi/hubWebui tier above; every other rendered module
# shares one generic legacy tier (50m/96Mi req, 300m/384Mi lim).
modules:
  hub:
    replicas: 1
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "400m", memory: "384Mi" }
    env:
      RATE_LIMIT_MAX_REQUESTS: "1000"    # ~10x default; local e2e test/dev only
      RATE_LIMIT_WINDOW_MS: "60000"      # keep 60s window unchanged
  hubWebui:
    replicas: 1
    resources:
      requests: { cpu: "50m", memory: "64Mi" }
      limits: { cpu: "200m", memory: "256Mi" }
  router:
