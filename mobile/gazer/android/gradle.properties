org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=false
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
# android.newDsl / android.builtInKotlin explicitly forced off: AGP 9.1.0's default
# (newDsl-decorated) ApplicationExtension crashes dev.flutter.flutter-gradle-plugin with
# `ApplicationExtensionImpl$AgpDecorated_Decorated cannot be cast to AbstractAppExtension`
# at com.flutter.gradle.FlutterPlugin.addFlutterTasks -- a confirmed, still-open upstream bug
# (flutter/flutter#192111, Flutter team: "AGP 9.1.0 ... ahead of what 3.47.2 officially
# supports"). Forcing the classic (non-decorated) extension via these two flags avoids the
# crash without downgrading the spec-pinned AGP 9.1.0/Kotlin 2.4.0 versions.
android.newDsl=false
android.builtInKotlin=false
